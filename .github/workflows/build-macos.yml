name: Build macOS distribution

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payload:
    name: Build ARM64 Linux guest payload
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build embedded guest payload
        run: >-
          nix build
          --print-build-logs
          --out-link result-payload
          .#packages.aarch64-linux.embedded-payload

      - name: Stage payload
        run: |
          mkdir ci-payload
          cp result-payload/architecture ci-payload/
          cp result-payload/payload.sha256 ci-payload/
          cp result-payload/payload.size ci-payload/
          cp result-payload/payload.tar.xz ci-payload/

      - name: Upload payload for macOS build
        uses: actions/upload-artifact@v4
        with:
          name: tascarrel-aarch64-linux-payload
          path: ci-payload/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  macos:
    name: Build ARM64 macOS CLI
    needs: payload
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download embedded guest payload
        uses: actions/download-artifact@v4
        with:
          name: tascarrel-aarch64-linux-payload
          path: .ci/payload

      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1

      - name: Build macOS distribution
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_TERM_COLOR: always
          TASCARREL_EMBEDDED_PAYLOAD_DIR: ${{ github.workspace }}/.ci/payload
        run: cargo +1.97.1 build --locked --release --package tascarrel-cli

      - name: Verify and package binary
        run: |
          test "$(uname -m)" = arm64
          test -x target/release/tascarrel
          file target/release/tascarrel | grep -F "Mach-O 64-bit executable arm64"
          target/release/tascarrel --version
          mkdir dist
          cp target/release/tascarrel dist/tascarrel
          tar -C dist -czf tascarrel-aarch64-darwin.tar.gz tascarrel
          shasum -a 256 tascarrel-aarch64-darwin.tar.gz > tascarrel-aarch64-darwin.tar.gz.sha256

      - name: Upload macOS distribution
        uses: actions/upload-artifact@v4
        with:
          name: tascarrel-aarch64-darwin-${{ github.sha }}
          path: |
            tascarrel-aarch64-darwin.tar.gz
            tascarrel-aarch64-darwin.tar.gz.sha256
          if-no-files-found: error
