name: Build release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  guest-payload:
    name: Build ${{ matrix.guest_system }} guest payload
    runs-on: [self-hosted, linux, x64, nixos]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - guest_system: x86_64-linux
            architecture: x86_64
          - guest_system: aarch64-linux
            architecture: aarch64
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build guest payload
        run: >-
          nix build
          --print-build-logs
          --out-link result-payload
          ".#packages.x86_64-linux.guest-payload-${{ matrix.guest_system }}"

      - name: Stage and verify guest payload
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
          PAYLOAD_DIRECTORY: .ci/payload/${{ matrix.guest_system }}
        run: |
          set -euo pipefail
          mkdir -p "$PAYLOAD_DIRECTORY"
          cp -L result-payload/architecture "$PAYLOAD_DIRECTORY/"
          cp -L result-payload/payload.sha256 "$PAYLOAD_DIRECTORY/"
          cp -L result-payload/payload.size "$PAYLOAD_DIRECTORY/"
          cp -L result-payload/payload.tar.xz "$PAYLOAD_DIRECTORY/"

          test "$(cat "$PAYLOAD_DIRECTORY/architecture")" = "$EXPECTED_ARCHITECTURE"
          test "$(stat --format '%s' "$PAYLOAD_DIRECTORY/payload.tar.xz")" = \
            "$(cat "$PAYLOAD_DIRECTORY/payload.size")"
          test "$(sha256sum "$PAYLOAD_DIRECTORY/payload.tar.xz" | cut -d ' ' -f 1)" = \
            "$(cat "$PAYLOAD_DIRECTORY/payload.sha256")"

      - name: Upload guest payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tascarrel-guest-${{ matrix.guest_system }}-${{ github.sha }}
          path: .ci/payload/${{ matrix.guest_system }}/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  host-release:
    name: Build ${{ matrix.release_target }} release
    needs: guest-payload
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - release_target: x86_64-linux
            rust_target: x86_64-unknown-linux-musl
            guest_system: x86_64-linux
            guest_architecture: x86_64
            runner: ubuntu-24.04
            file_pattern: "ELF 64-bit LSB.*x86-64"
          - release_target: aarch64-linux
            rust_target: aarch64-unknown-linux-musl
            guest_system: aarch64-linux
            guest_architecture: aarch64
            runner: ubuntu-24.04-arm
            file_pattern: "ELF 64-bit LSB.*ARM aarch64"
          - release_target: aarch64-darwin
            rust_target: aarch64-apple-darwin
            guest_system: aarch64-linux
            guest_architecture: aarch64
            runner: macos-15
            file_pattern: "Mach-O 64-bit executable arm64"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download guest payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tascarrel-guest-${{ matrix.guest_system }}-${{ github.sha }}
          path: .ci/payload

      - name: Verify guest payload
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.guest_architecture }}
        run: |
          set -euo pipefail
          test "$(cat .ci/payload/architecture)" = "$EXPECTED_ARCHITECTURE"
          test "$(wc -c < .ci/payload/payload.tar.xz | tr -d ' ')" = \
            "$(cat .ci/payload/payload.size)"
          test "$(shasum -a 256 .ci/payload/payload.tar.xz | cut -d ' ' -f 1)" = \
            "$(cat .ci/payload/payload.sha256)"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          echo "CC=musl-gcc" >> "$GITHUB_ENV"
          case "$RUST_TARGET" in
            x86_64-unknown-linux-musl)
              echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
              ;;
            aarch64-unknown-linux-musl)
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Install Rust toolchain
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --target "$RUST_TARGET"

      - name: Build host release
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_TERM_COLOR: always
          RUST_TARGET: ${{ matrix.rust_target }}
          TASCARREL_EMBEDDED_PAYLOAD_DIR: ${{ github.workspace }}/.ci/payload
        run: >-
          cargo +1.97.1 build
          --locked
          --release
          --package tascarrel-cli
          --target "$RUST_TARGET"

      - name: Verify and package host release
        env:
          BINARY: target/${{ matrix.rust_target }}/release/tascarrel
          FILE_PATTERN: ${{ matrix.file_pattern }}
          RELEASE_TARGET: ${{ matrix.release_target }}
        run: |
          set -euo pipefail
          test -x "$BINARY"
          file "$BINARY" | grep -E "$FILE_PATTERN"
          if [ "${{ runner.os }}" = Linux ]; then
            program_headers=$(readelf --program-headers "$BINARY")
            if grep -F "Requesting program interpreter" <<< "$program_headers"; then
              echo "release binary has a dynamic program interpreter" >&2
              exit 1
            fi
          fi
          "$BINARY" --version

          archive="tascarrel-$RELEASE_TARGET.tar.gz"
          mkdir -p dist/package
          cp "$BINARY" dist/package/tascarrel
          tar -C dist/package -czf "dist/$archive" tascarrel
          if [ "${{ runner.os }}" = macOS ]; then
            (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          else
            (cd dist && sha256sum "$archive" > "$archive.sha256")
          fi

      - name: Upload host release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tascarrel-release-${{ matrix.release_target }}-${{ github.sha }}
          path: |
            dist/tascarrel-${{ matrix.release_target }}.tar.gz
            dist/tascarrel-${{ matrix.release_target }}.tar.gz.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: host-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download host releases
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tascarrel-release-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Verify release archives
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name 'tascarrel-*.tar.gz' -type f | wc -l)" -eq 3
          test "$(find dist -maxdepth 1 -name 'tascarrel-*.tar.gz.sha256' -type f | wc -l)" -eq 3
          (cd dist && sha256sum --check ./*.sha256)

      - name: Publish release assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --generate-notes \
              --title "$RELEASE_TAG" \
              --verify-tag
          fi
