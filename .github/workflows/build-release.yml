name: Build release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  guest-payload:
    name: Build ${{ matrix.guest_system }} guest payload
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - guest_system: x86_64-linux
            architecture: x86_64
            runner: [self-hosted, linux, x64, nixos]
            install_nix: false
          - guest_system: aarch64-linux
            architecture: aarch64
            runner: ubuntu-24.04-arm
            install_nix: true
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        if: matrix.install_nix
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        with:
          determinate: false

      - name: Build guest payload
        run: >-
          nix build
          --print-build-logs
          --out-link result-payload
          ".#packages.${{ matrix.guest_system }}.guest-payload"

      - name: Stage and verify guest payload
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
          PAYLOAD_DIRECTORY: .ci/payload/${{ matrix.guest_system }}
        run: |
          set -euo pipefail
          mkdir -p "$PAYLOAD_DIRECTORY"
          cp -L result-payload/architecture "$PAYLOAD_DIRECTORY/"
          cp -L result-payload/payload.sha256 "$PAYLOAD_DIRECTORY/"
          cp -L result-payload/payload.size "$PAYLOAD_DIRECTORY/"
          cp -L result-payload/payload.tar.xz "$PAYLOAD_DIRECTORY/"

          test "$(cat "$PAYLOAD_DIRECTORY/architecture")" = "$EXPECTED_ARCHITECTURE"
          test "$(stat --format '%s' "$PAYLOAD_DIRECTORY/payload.tar.xz")" = \
            "$(cat "$PAYLOAD_DIRECTORY/payload.size")"
          test "$(sha256sum "$PAYLOAD_DIRECTORY/payload.tar.xz" | cut -d ' ' -f 1)" = \
            "$(cat "$PAYLOAD_DIRECTORY/payload.sha256")"

      - name: Upload guest payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tascarrel-guest-${{ matrix.guest_system }}-${{ github.sha }}
          path: .ci/payload/${{ matrix.guest_system }}/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  host-release:
    name: Build ${{ matrix.release_target }} release
    needs: guest-payload
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - release_target: x86_64-linux
            rust_target: x86_64-unknown-linux-musl
            desktop_target: x86_64-unknown-linux-gnu
            desktop_bundles: deb,rpm
            guest_system: x86_64-linux
            guest_architecture: x86_64
            runner: ubuntu-24.04
            file_pattern: "ELF 64-bit LSB.*x86-64"
          - release_target: aarch64-linux
            rust_target: aarch64-unknown-linux-musl
            desktop_target: aarch64-unknown-linux-gnu
            desktop_bundles: deb,rpm
            guest_system: aarch64-linux
            guest_architecture: aarch64
            runner: ubuntu-24.04-arm
            file_pattern: "ELF 64-bit LSB.*ARM aarch64"
          - release_target: aarch64-darwin
            rust_target: aarch64-apple-darwin
            desktop_target: aarch64-apple-darwin
            desktop_bundles: dmg
            guest_system: aarch64-linux
            guest_architecture: aarch64
            runner: macos-15
            file_pattern: "Mach-O 64-bit executable arm64"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download guest payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tascarrel-guest-${{ matrix.guest_system }}-${{ github.sha }}
          path: .ci/payload

      - name: Verify guest payload
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.guest_architecture }}
        run: |
          set -euo pipefail
          test "$(cat .ci/payload/architecture)" = "$EXPECTED_ARCHITECTURE"
          test "$(wc -c < .ci/payload/payload.tar.xz | tr -d ' ')" = \
            "$(cat .ci/payload/payload.size)"
          test "$(shasum -a 256 .ci/payload/payload.tar.xz | cut -d ' ' -f 1)" = \
            "$(cat .ci/payload/payload.sha256)"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            musl-tools \
            patchelf \
            rpm
          echo "CC=musl-gcc" >> "$GITHUB_ENV"
          case "$RUST_TARGET" in
            x86_64-unknown-linux-musl)
              echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
              ;;
            aarch64-unknown-linux-musl)
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Install Rust toolchain
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --target "$RUST_TARGET"

      - name: Install Tauri CLI
        run: cargo +1.97.1 install tauri-cli --version 2.11.4 --locked

      - name: Build host release
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_TERM_COLOR: always
          RUST_TARGET: ${{ matrix.rust_target }}
          TASCARREL_EMBEDDED_PAYLOAD_DIR: ${{ github.workspace }}/.ci/payload
        run: >-
          cargo +1.97.1 build
          --locked
          --release
          --package tascarrel-cli
          --target "$RUST_TARGET"

      - name: Verify and package host release
        env:
          BINARY: target/${{ matrix.rust_target }}/release/tascarrel
          CLIENT: target/${{ matrix.rust_target }}/release/tascarrelctl
          FILE_PATTERN: ${{ matrix.file_pattern }}
          RELEASE_TARGET: ${{ matrix.release_target }}
        run: |
          set -euo pipefail
          test -x "$BINARY"
          test -x "$CLIENT"
          file "$BINARY" | grep -E "$FILE_PATTERN"
          if [ "${{ runner.os }}" = Linux ]; then
            program_headers=$(readelf --program-headers "$BINARY")
            if grep -F "Requesting program interpreter" <<< "$program_headers"; then
              echo "release binary has a dynamic program interpreter" >&2
              exit 1
            fi
          fi
          "$BINARY" --version

          "$CLIENT" --version

          archive="tascarrel-server-$RELEASE_TARGET.tar.gz"
          mkdir -p dist/package
          cp "$BINARY" dist/package/tascarrel
          cp "$CLIENT" dist/package/tascarrelctl
          tar -C dist/package -czf "dist/$archive" tascarrel tascarrelctl
          if [ "${{ runner.os }}" = macOS ]; then
            (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          else
            (cd dist && sha256sum "$archive" > "$archive.sha256")
          fi

      - name: Stage the desktop server sidecar
        env:
          DESKTOP_TARGET: ${{ matrix.desktop_target }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          sidecars=crates/apps/tascarrel-desktop/binaries
          mkdir -p "$sidecars"
          cp "target/$RUST_TARGET/release/tascarrel" \
            "$sidecars/tascarrel-$DESKTOP_TARGET"

      - name: Build desktop packages
        working-directory: crates/apps/tascarrel-desktop
        env:
          DESKTOP_BUNDLES: ${{ matrix.desktop_bundles }}
        run: >-
          cargo +1.97.1 tauri build
          --config tauri.bundle.conf.json
          --bundles "$DESKTOP_BUNDLES"
          --
          --locked

      - name: Stage desktop packages
        env:
          RELEASE_TARGET: ${{ matrix.release_target }}
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = macOS ]; then
            dmg=$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -type f)
            test "$(wc -l <<< "$dmg" | tr -d ' ')" -eq 1
            package="tascarrel-desktop-$RELEASE_TARGET.dmg"
            cp "$dmg" "dist/$package"
            (cd dist && shasum -a 256 "$package" > "$package.sha256")
          else
            deb=$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -type f)
            rpm=$(find target/release/bundle/rpm -maxdepth 1 -name '*.rpm' -type f)
            test "$(wc -l <<< "$deb" | tr -d ' ')" -eq 1
            test "$(wc -l <<< "$rpm" | tr -d ' ')" -eq 1
            deb_archive="tascarrel-desktop-$RELEASE_TARGET.deb"
            rpm_archive="tascarrel-desktop-$RELEASE_TARGET.rpm"
            cp "$deb" "dist/$deb_archive"
            cp "$rpm" "dist/$rpm_archive"
            (cd dist && sha256sum "$deb_archive" "$rpm_archive" > desktop.sha256)
            awk -v deb="$deb_archive" '$2 == deb { print }' dist/desktop.sha256 \
              > "dist/$deb_archive.sha256"
            awk -v rpm="$rpm_archive" '$2 == rpm { print }' dist/desktop.sha256 \
              > "dist/$rpm_archive.sha256"
            rm dist/desktop.sha256
          fi

      - name: Upload host release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tascarrel-release-${{ matrix.release_target }}-${{ github.sha }}
          path: |
            dist/tascarrel-server-${{ matrix.release_target }}.tar.gz
            dist/tascarrel-server-${{ matrix.release_target }}.tar.gz.sha256
            dist/tascarrel-desktop-${{ matrix.release_target }}.*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: host-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download host releases
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tascarrel-release-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Verify release archives
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name 'tascarrel-server-*.tar.gz' -type f | wc -l)" -eq 3
          test "$(find dist -maxdepth 1 -name 'tascarrel-desktop-*.deb' -type f | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -name 'tascarrel-desktop-*.rpm' -type f | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -name 'tascarrel-desktop-*.dmg' -type f | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.sha256' -type f | wc -l)" -eq 8
          (cd dist && sha256sum --check ./*.sha256)

      - name: Publish release assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --generate-notes \
              --title "$RELEASE_TAG" \
              --verify-tag
          fi
