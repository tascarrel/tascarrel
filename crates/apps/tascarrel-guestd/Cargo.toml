[package]
name = "tascarrel-guest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Tascarrel daemon running inside guest VMs"

[dependencies]
anyhow = "1.0"
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
clap = { version = "4.5", features = ["derive", "env"] }
flate2.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
hickory-proto.workspace = true
jiff.workspace = true
nix = { workspace = true, features = ["fanotify", "fs", "mount", "net", "process", "signal", "socket", "term", "user"] }
reportify.workspace = true
reqwest.workspace = true
rustix = { workspace = true, features = ["fs", "net", "process", "termios"] }
serde = { workspace = true, features = ["derive"] }
serde_ignored.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
sysinfo = { workspace = true, features = ["disk", "system"] }
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rusqlite.workspace = true
toml = "0.9"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid.workspace = true
vte.workspace = true
vt100.workspace = true
tascarrel-api = { path = "../../libs/tascarrel-api" }
tascarrel-agent.workspace = true
tascarrel-git.workspace = true
tascarrel-protocol = { path = "../../libs/tascarrel-protocol" }
tascarrel-mux = { path = "../../libs/tascarrel-mux" }
tascarrel-store = { path = "../../libs/tascarrel-store" }
zstd = "0.13"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
