[package]
name = "tascarrel-podctl"
description = "Authenticated control and data-plane client for a Tascarrel pod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "podctl"
path = "src/main.rs"

[dependencies]
base64.workspace = true
clap = { workspace = true, features = ["derive"] }
reportify.workspace = true
rustix = { workspace = true, features = ["fs"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
tascarrel-api.workspace = true
tascarrel-git.workspace = true
tascarrel-mux.workspace = true
tascarrel-protocol.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
