[package]
name = "tascarrel-podd"
description = "Minimal PID 1 and nested-service supervisor for Tascarrel pods"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tascarrel-podd"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
nix = { version = "0.30", features = ["fs", "process", "signal", "socket", "uio", "user"] }

[dev-dependencies]
tempfile = "3.20"

[lints]
workspace = true
