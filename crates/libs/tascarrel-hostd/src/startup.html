<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tascarrel</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #111416;
        color: #f4f7f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(560px, calc(100vw - 48px));
      }

      h1 {
        margin: 0 0 36px;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      h2 {
        margin: 0;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.035em;
      }

      p {
        margin: 12px 0 0;
        color: #aab3b7;
        font-size: 15px;
        line-height: 1.55;
      }

      progress {
        width: 100%;
        height: 5px;
        margin: 28px 0 0;
        border: 0;
        border-radius: 999px;
        overflow: hidden;
        background: #293034;
      }

      progress::-webkit-progress-bar {
        background: #293034;
      }

      progress::-webkit-progress-value {
        background: #55b9df;
      }

      progress::-moz-progress-bar {
        background: #55b9df;
      }

      #progress-detail {
        min-height: 22px;
        margin-top: 8px;
        font-variant-numeric: tabular-nums;
        font-size: 13px;
      }

      #issues {
        display: grid;
        gap: 16px;
        margin: 28px 0 0;
        padding: 0;
        list-style: none;
      }

      #issues li {
        padding-left: 16px;
        border-left: 2px solid #e17878;
      }

      #issues strong {
        display: block;
        font-size: 14px;
        font-weight: 600;
      }

      #issues p {
        margin-top: 4px;
        font-size: 13px;
      }

      #issues .remediation {
        color: #d8dee1;
      }

      #actions {
        display: flex;
        gap: 10px;
        margin-top: 28px;
      }

      button {
        min-height: 38px;
        padding: 0 16px;
        border: 1px solid #3d484d;
        border-radius: 7px;
        background: #20262a;
        color: inherit;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }

      button:hover {
        background: #293136;
      }

      button:focus-visible {
        outline: 2px solid #70c9eb;
        outline-offset: 2px;
      }

      button.primary {
        border-color: #55b9df;
        background: #55b9df;
        color: #071116;
        font-weight: 600;
      }

      button.primary:hover {
        background: #70c9eb;
      }

      #metadata {
        margin-top: 36px;
        color: #707b80;
        font-size: 12px;
      }

      #pairing-form {
        display: grid;
        gap: 14px;
        margin-top: 28px;
      }

      #pairing-form label {
        display: grid;
        gap: 7px;
        color: #d8dee1;
        font-size: 13px;
        font-weight: 600;
      }

      #pairing-form input {
        min-height: 42px;
        padding: 8px 11px;
        border: 1px solid #3d484d;
        border-radius: 7px;
        background: #171c1f;
        color: inherit;
        font: inherit;
      }

      #pairing-form input:focus {
        border-color: #55b9df;
        outline: 2px solid rgb(85 185 223 / 30%);
        outline-offset: 1px;
      }

      #pairing-error {
        color: #f1a4a4;
        font-size: 13px;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tascarrel</h1>
      <section id="pairing" aria-live="polite" hidden>
        <h2>Pair This Browser</h2>
        <p>Run <code>tascarrelctl auth pair</code> on the Tascarrel host, then enter the single-use key.</p>
        <form id="pairing-form">
          <label>
            Pairing key
            <input id="pairing-key" type="password" autocomplete="one-time-code" required />
          </label>
          <label>
            Device label (optional)
            <input id="pairing-label" type="text" autocomplete="off" maxlength="80" placeholder="Work laptop" />
          </label>
          <p id="pairing-error" role="alert"></p>
          <button class="primary" id="pair" type="submit">Pair browser</button>
        </form>
      </section>
      <section id="startup" aria-live="polite" hidden>
        <h2 id="title">Starting</h2>
        <p id="detail">Connecting to the Tascarrel server…</p>
        <progress id="progress"></progress>
        <p id="progress-detail"></p>
        <ul id="issues"></ul>
        <div id="actions">
          <button class="primary" id="retry" type="button" hidden>Retry</button>
          <button id="reload" type="button" hidden>Reload</button>
        </div>
        <p id="metadata"></p>
      </section>
    </main>
    <script>
      const title = document.querySelector("#title");
      const pairing = document.querySelector("#pairing");
      const startup = document.querySelector("#startup");
      const pairingForm = document.querySelector("#pairing-form");
      const pairingKey = document.querySelector("#pairing-key");
      const pairingLabel = document.querySelector("#pairing-label");
      const pairingError = document.querySelector("#pairing-error");
      const pair = document.querySelector("#pair");
      const detail = document.querySelector("#detail");
      const progress = document.querySelector("#progress");
      const progressDetail = document.querySelector("#progress-detail");
      const issues = document.querySelector("#issues");
      const retry = document.querySelector("#retry");
      const reload = document.querySelector("#reload");
      const metadata = document.querySelector("#metadata");
      const expectedVersion = new URLSearchParams(location.search).get(
        "desktopVersion",
      );
      const expectedProtocolVersion = new URLSearchParams(location.search).get(
        "desktopProtocolVersion",
      );

      function formatBytes(value) {
        const bytes = Number(value);
        for (const [unit, size] of [
          ["GiB", 1024 ** 3],
          ["MiB", 1024 ** 2],
          ["KiB", 1024],
        ]) {
          if (bytes >= size) return `${(bytes / size).toFixed(1)} ${unit}`;
        }
        return `${bytes} B`;
      }

      function clearIssues() {
        issues.replaceChildren();
      }

      function renderIssue(issue) {
        const item = document.createElement("li");
        const name = document.createElement("strong");
        const issueDetail = document.createElement("p");
        name.textContent = issue.title;
        issueDetail.textContent = issue.detail;
        item.append(name, issueDetail);
        if (issue.remediation) {
          const remediation = document.createElement("p");
          remediation.className = "remediation";
          remediation.textContent = issue.remediation;
          item.append(remediation);
        }
        issues.append(item);
      }

      function render(status) {
        metadata.textContent = `Server ${status.serverVersion} · Protocol ${status.protocolVersion}`;
        retry.hidden = true;
        reload.hidden = true;
        clearIssues();

        if (
          (expectedVersion && expectedVersion !== status.serverVersion) ||
          (expectedProtocolVersion &&
            Number(expectedProtocolVersion) !== status.protocolVersion)
        ) {
          title.textContent = "Version Mismatch";
          detail.textContent = `Tascarrel Desktop ${expectedVersion ?? "unknown"} found server ${status.serverVersion} with a different application or protocol version. Restart the server after updating it, then reload this window.`;
          progress.hidden = true;
          progressDetail.textContent = "";
          reload.hidden = false;
          return;
        }

        if (status.state.status === "Ready") {
          location.replace("/");
          return;
        }

        if (status.state.status === "Failed") {
          title.textContent = "Tascarrel Could Not Start";
          detail.textContent = status.state.summary;
          progress.hidden = true;
          progressDetail.textContent = "";
          for (const issue of status.state.issues) renderIssue(issue);
          retry.hidden = !status.state.retryable;
          reload.hidden = false;
          return;
        }

        title.textContent = "Starting";
        detail.textContent = status.state.detail;
        progress.hidden = false;
        const payload = status.state.payload;
        if (payload) {
          progress.max = Number(payload.totalBytes);
          progress.value = Number(payload.completedBytes);
          progressDetail.textContent = `${formatBytes(payload.completedBytes)} of ${formatBytes(payload.totalBytes)}`;
        } else {
          progress.removeAttribute("value");
          progressDetail.textContent = "";
        }
      }

      retry.addEventListener("click", async () => {
        retry.disabled = true;
        try {
          const response = await fetch("/api/v1/server/retry", {
            method: "POST",
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
        } catch (error) {
          detail.textContent = `Could not request another startup attempt: ${error.message}`;
        } finally {
          retry.disabled = false;
        }
      });

      reload.addEventListener("click", () => location.reload());

      pairingForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        pair.disabled = true;
        pairingError.textContent = "";
        try {
          const response = await fetch("/api/v1/auth/pair", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              pairingKey: pairingKey.value.trim(),
              ...(pairingLabel.value.trim() ? { label: pairingLabel.value.trim() } : {}),
            }),
          });
          if (!response.ok) throw new Error("That pairing key is invalid, expired, or already used.");
          pairing.hidden = true;
          startStatus();
        } catch (error) {
          pairingError.textContent = error instanceof Error
            ? error.message
            : "Tascarrel could not pair this browser.";
        } finally {
          pair.disabled = false;
        }
      });

      async function initialize() {
        try {
          const response = await fetch("/api/v1/auth/session", { cache: "no-store" });
          if (response.status === 204) {
            startStatus();
            return;
          }
          if (response.status !== 401) {
            throw new Error("Tascarrel could not verify this browser session.");
          }
        } catch (error) {
          pairingError.textContent = error instanceof Error
            ? error.message
            : "Tascarrel could not verify this browser session.";
        }
        pairing.hidden = false;
        pairingKey.focus();
      }

      function startStatus() {
        startup.hidden = false;
        const events = new EventSource("/api/v1/server/status/events");
        events.onmessage = (event) => render(JSON.parse(event.data));
        events.onerror = () => {
          title.textContent = "Connecting";
          detail.textContent =
            "The Tascarrel server connection was interrupted. Reconnecting…";
          progress.hidden = false;
          progress.removeAttribute("value");
          progressDetail.textContent = "";
          reload.hidden = false;
        };
      }

      void initialize();
    </script>
  </body>
</html>
